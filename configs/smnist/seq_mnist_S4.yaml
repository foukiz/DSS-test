PROJECT: "seq_MNIST_S4"
DATASET:
  NAME: sMNIST
  TRAIN_SIZE: 50000
  VAL_SIZE: 10000
MODEL:
  ACTIVATION: $torch.nn.GELU
  BIAS: True
  BIDIRECTIONAL: False
  DROPOUT: 0.
  ENCODING: linear
  INPUT_SIZE: 256
  N_LAYERS: 6
  NAME: S4
  NORMALIZATION: [layer_norm, batch_norm]
  POOLING: average
  PRENORM: False
  SEED: [712,8,93] #[712,8,93,74,812]
  STATE_SIZE: 64
TRAIN:
  BATCH_SIZE: 50
  DISPLAY_EPOCH: True
  DISPLAY_EVERY: null
  LOSS_FN: $torch.nn.CrossEntropyLoss
  LOSS_CONFIG: null
  METRICS: {'accuracy': $torchmetrics.Accuracy}
  METRICS_CONFIG:
    task: multiclass
    num_classes: 10
  N_EPOCHS: 100
  OPTIMIZER:  $torch.optim.AdamW
  OPTIMIZER_CONFIG:
    lr: [1.e-2, 1.e-3]
    weight_decay: 1.e-2
  SCHEDULER: $torch.optim.lr_scheduler.StepLR
  SCHEDULER_CONFIG:
    gamma: 1.
    step_size: 1
  TORCH_DEVICE: cpu
  TRACK_NORMS: True
  USE_TQDM: False
  USE_WANDB: False