PROJECT: "seq_CIFAR10_gamma"
DATASET:
  NAME: sCIFAR10
  TRAIN_SIZE: 45000
  VAL_SIZE: 5000
MODEL:
  ACTIVATION: $torch.nn.GELU
  BIAS: True
  BIDIRECTIONAL: False
  DROPOUT: [0.2]
  ENCODING: linear
  INPUT_SIZE: 512
  KERNEL_VERSION: myown
  N_LAYERS: 10
  NAME: DSS
  NORMALIZATION: layer_norm
  POOLING: average
  PRENORM: False
  SEED: [1112] #[712,8,93,74,812]
  USE_LENGTHS: False
TRAIN:
  BATCH_SIZE: [50]
  DISPLAY_EPOCH: True
  DISPLAY_EVERY: null
  INSPECT_GRADIENTS: False
  GET_GRADIENTS: False
  LOSS_FN: $torch.nn.CrossEntropyLoss
  LOSS_CONFIG: null
  METRICS: {'accuracy': $torchmetrics.Accuracy}
  METRICS_CONFIG:
    task: multiclass
    num_classes: 10
  N_EPOCHS: 200
  OPTIMIZER: $torch.optim.AdamW
  OPTIMIZER_CONFIG:
    lr: [0.004]
    weight_decay: [0.01]
  #SCHEDULER: $torch.optim.lr_scheduler.SequentialLR
  #SCHEDULER_CONFIG:
  #  scheduler1: $torch.optim.lr_scheduler.LinearLR
  #  scheduler1_config:
  #    start_factor: 0.2
  #    total_iters: 20
  #  scheduler2: $torch.optim.lr_scheduler.CosineAnnealingLR
  #  scheduler2_config:
  #    T_max: 190
  #    eta_min: 0.00001
  #  milestones: 20
  SCHEDULER: $torch.optim.lr_scheduler.ReduceLROnPlateau
  SCHEDULER_CONFIG:
    patience: 10
    factor: 0.2           #### testparametre ####
    min_lr: 0.000004
#  SCHEDULER: $torch.optim.lr_scheduler.StepLR
#  SCHEDULER_CONFIG:
#    step_size: 1.
#    gamma: 0.98
  TORCH_DEVICE: cpu
  TRACK_NORMS: False
  USE_TQDM: False
  USE_WANDB: False