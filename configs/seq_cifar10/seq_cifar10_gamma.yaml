PROJECT: "seq_CIFAR10_gamma_no_residual"
DATASET:
  NAME: sCIFAR10
  TRAIN_SIZE: 45000
  VAL_SIZE: 5000
MODEL:
  ACTIVATION: $torch.nn.GELU 
  ALPHA_MEAN: [3.5,2.]
  ALPHA_STD: [0.5]
  THETA_MEAN: [4.]
  THETA_STD: 0.5
  BIAS: True
  BIDIRECTIONAL: False
  DROPOUT: 0.2
  ENCODING: linear
  INPUT_SIZE: 512
  KERNEL_VERSION: gamma
  N_LAYERS: 6
  NAME: DSS
  NORMALIZATION: layer_norm
  POOLING: average
  PRENORM: False
  SEED: [712,8] #[712,8,93,74,812]
  STATE_SIZE: 64
TRAIN:
  BATCH_SIZE: 50
  DISPLAY_EPOCH: True
  DISPLAY_EVERY: null
  LOSS_FN: $torch.nn.CrossEntropyLoss
  LOSS_CONFIG: null
  METRICS: {'accuracy': $torchmetrics.Accuracy}
  METRICS_CONFIG:
    task: multiclass
    num_classes: 10
  N_EPOCHS: 80
  OPTIMIZER: $torch.optim.AdamW
  OPTIMIZER_CONFIG:
    lr: [4.e-3]
    weight_decay: 1.e-2
  SCHEDULER: $torch.optim.lr_scheduler.StepLR
  SCHEDULER_CONFIG:
    gamma: 0.95
    step_size: 1
  TORCH_DEVICE: cpu
  TRACK_NORMS: True
  USE_TQDM: False
  USE_WANDB: False