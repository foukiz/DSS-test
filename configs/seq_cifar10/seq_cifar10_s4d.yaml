PROJECT: "seq_CIFAR10_S4D"
DATASET:
  NAME: sCIFAR10
  TRAIN_SIZE: 45000
  VAL_SIZE: 5000
MODEL:
  ACTIVATION: $torch.nn.GELU 
  BIAS: True
  BIDIRECTIONAL: True
  DISC: bilinear
  DROPOUT: 0.1
  ENCODING: linear
  INPUT_SIZE: 512
  KERNEL_VERSION: exp
  N_LAYERS: 6
  NAME: S4D
  NORMALIZATION: [layer_norm]
  POOLING: average
  PRENORM: False
  SEED: [1112] #[712,8,93,74,812]
  STATE_SIZE: [64]
  USE_LENGTHS: False
TRAIN:
  BATCH_SIZE: 50
  DISPLAY_EPOCH: True
  DISPLAY_EVERY: null
  LOSS_FN: $torch.nn.CrossEntropyLoss
  LOSS_CONFIG: null
  METRICS: {'accuracy': $torchmetrics.Accuracy}
  METRICS_CONFIG:
    task: multiclass
    num_classes: 10
  N_EPOCHS: 200
  OPTIMIZER: $torch.optim.AdamW
  OPTIMIZER_CONFIG:
    lr: 0.01
    weight_decay: 0.05
  SCHEDULER: $torch.optim.lr_scheduler.CosineAnnealingLR
  SCHEDULER_CONFIG:
    T_max: 200
  TORCH_DEVICE: cpu
  TRACK_NORMS: False
  USE_TQDM: False
  USE_WANDB: False