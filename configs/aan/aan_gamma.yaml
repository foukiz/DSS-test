PROJECT: "AAN_gamma"
DATASET:
  NAME: AAN
  MAX_LEN: 4000
  TEST_SIZE: 147085
  TRAIN_SIZE: 18089
  VAL_SIZE: 17436
MODEL:
  ALPHA_MEAN: [2.,3.]
  ALPHA_STD: [0.5]
  THETA_MEAN: [2.]
  THETA_STD: 0.5
  ACTIVATION: $torch.nn.GELU
  BIAS: True
  INPUT_SIZE: 256
  N_LAYERS: 6
  KERNEL_VERSION: gamma
  BIDIRECTIONAL: False
  ENCODING: embedding
  POOLING: average
  NAME: DSS
  DROPOUT: 0.
  NORMALIZATION: batch_norm
  SEED: [712,8,93] #[712,8,93,74,812]
TRAIN:
  BATCH_SIZE: 64
  DISPLAY_EPOCH: True
  DISPLAY_EVERY: null
  LOSS_FN: $torch.nn.CrossEntropyLoss  #$torch.nn.BCEWithLogitsLoss  #BCE if the output of the model is unidimensional
  LOSS_CONFIG: null
  METRICS: {'accuracy': $torchmetrics.Accuracy} #{'accuracy': $torchmetrics.classification.BinaryAccuracy}
  METRICS_CONFIG:
    task: multiclass
    num_classes: 2
  N_EPOCHS: 25
  OPTIMIZER: $torch.optim.AdamW
  OPTIMIZER_CONFIG:
    lr: [2.e-3]
    weight_decay: 1.e-2
  SCHEDULER: $torch.optim.lr_scheduler.StepLR
  SCHEDULER_CONFIG:
    gamma: 0.9
    step_size: 1
  TORCH_DEVICE: cpu
  USE_TQDM: False
  USE_WANDB: False