PROJECT: "IMDB_gamma"
DATASET:
  NAME: IMDB
  MAX_LEN: 2048
  TEST_SIZE: 12500
  TRAIN_SIZE: 25000
  VAL_SIZE: 12500
MODEL:
  ALPHA_MEAN: [3.,4.,6.]
  ALPHA_STD: [0.5]
  THETA_MEAN: [4.]
  THETA_STD: 0.5
  ACTIVATION: $torch.nn.GELU
  BIAS: True
  BIDIRECTIONAL: False
  DROPOUT: 0.
  ENCODING: embedding
  INPUT_SIZE: 128
  KERNEL_VERSION: gamma
  N_LAYERS: 4
  NAME: DSS
  NORMALIZATION: batch_norm
  POOLING: last
  PRENORM: True
  SEED: [712,8,93] #[712,8,93,74,812]
TRAIN:
  BATCH_SIZE: 50
  DISPLAY_EPOCH: True
  DISPLAY_EVERY: null
  LOSS_FN: $torch.nn.CrossEntropyLoss  #$torch.nn.BCEWithLogitsLoss  #BCE if the output of the model is unidimensional
  LOSS_CONFIG: null
  METRICS: {'accuracy': $torchmetrics.Accuracy} #{'accuracy': $torchmetrics.classification.BinaryAccuracy}
  METRICS_CONFIG:
    task: multiclass
    num_classes: 2
  N_EPOCHS: 40
  OPTIMIZER: $torch.optim.AdamW
  OPTIMIZER_CONFIG:
    lr: [1.e-2]
    weight_decay: 0.
  SCHEDULER: $torch.optim.lr_scheduler.StepLR
  SCHEDULER_CONFIG:
    gamma: 0.9
    step_size: 1
  TORCH_DEVICE: cpu
  USE_TQDM: False
  USE_WANDB: False