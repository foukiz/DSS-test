PROJECT: "IMDB_gamma_complex"
DATASET:
  NAME: IMDB
  MAX_LEN: 2048
  TEST_SIZE: 12500
  TRAIN_SIZE: 25000
  VAL_SIZE: 12500
MODEL:
  ALPHA_MEAN: [1.]
  ALPHA_STD: [0.1]
  BETA_MEAN: [4.,1.,2.]           #### test parameter ####
  BETA_STD: [0.1]
  THETA_MEAN: [0.]
  THETA_STD: [0.005,1.]           #### test parameter ####
  ACTIVATION: $torch.nn.GELU
  BIAS: True
  BIDIRECTIONAL: False
  DROPOUT: 0.1                    #### test parameter ####
  ENCODING: embedding
  INPUT_SIZE: 128
  KERNEL_VERSION: gamma_complex
  N_LAYERS: 4
  NAME: DSS
  NORMALIZATION: batch_norm
  POOLING: last
  PRENORM: True
  SEED: [1112] #[712,8,93,74,812]
  USE_LENGTHS: True
TRAIN:
  BATCH_SIZE: 50
  DISPLAY_EPOCH: True
  DISPLAY_EVERY: null
  LOSS_FN: $torch.nn.CrossEntropyLoss  #$torch.nn.BCEWithLogitsLoss  #BCE if the output of the model is unidimensional
  LOSS_CONFIG: null
  METRICS: {'accuracy': $torchmetrics.Accuracy}  #{'accuracy': $torchmetrics.classification.BinaryAccuracy}
  METRICS_CONFIG:
    task: multiclass
    num_classes: 2
  N_EPOCHS: 40
  OPTIMIZER: $torch.optim.AdamW
  OPTIMIZER_CONFIG:
    lr: [0.01]                 #### test parameter ####
    weight_decay: 0.
  SCHEDULER: $torch.optim.lr_scheduler.ReduceLROnPlateau
  SCHEDULER_CONFIG:
    patience: 10
  TORCH_DEVICE: cpu
  TRACK_NORMS: True
  USE_TQDM: False
  USE_WANDB: False