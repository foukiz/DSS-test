PROJECT: "copytask_Transformer_test"
DATASET:
  NAME: CopyMemory
  SENT_LENGTH: 10
  SEQ_LENGTH: 100
  TEST_SIZE: 20
  TRAIN_SIZE: 40
  VAL_SIZE: 20
  VOCABULARY: 10
MODEL:
  #ACTIVATION: $torch.nn.GELU
  BIAS: True
  ENCODING: embedding
  INPUT_SIZE: 8
  N_LAYERS: 6
  NAME: Transformer
  POOLING: manytomany
  SEED: [712] #[712,8,93,74,812]
  SEQ_LENGTH: 100
TRAIN:
  BATCH_SIZE: 20
  DISPLAY_EPOCH: True
  DISPLAY_EVERY: null
  LOSS_FN: $torch.nn.CrossEntropyLoss
  LOSS_CONFIG: null
  METRICS: null
  N_EPOCHS: 2
  OPTIMIZER: $torch.optim.AdamW
  OPTIMIZER_CONFIG:
    lr: 1.e-3
    weight_decay: 1.e-2
  SCHEDULER: $torch.optim.lr_scheduler.StepLR
  SCHEDULER_CONFIG:
    gamma: 1.
    step_size: 1
  TORCH_DEVICE: cpu
  USE_TQDM: True
  USE_WANDB: False