PROJECT: "copytask_S4"
DATASET:
  NAME: CopyMemory
  SENT_LENGTH: 10
  SEQ_LENGTH: 1000
  TEST_SIZE: 2000
  TRAIN_SIZE: 512000
  VAL_SIZE: 2000
  VOCABULARY: 10
MODEL:
  ACTIVATION: $torch.nn.GELU
  BIAS: True
  BIDIRECTIONAL: False
  DROPOUT: 0.
  ENCODING: embedding
  INPUT_SIZE: [64]
  N_LAYERS: 4
  NAME: S4
  NORMALIZATION: [layer_norm]
  POOLING: manytomany
  PRENORM: False
  SEED: [712,8] #[712,8,93,74,812]
  STATE_SIZE: 64
  USE_LENGTHS: False
TRAIN:
  BATCH_SIZE: 50
  DISPLAY_EPOCH: True
  DISPLAY_EVERY: null
  LOSS_FN: $torch.nn.CrossEntropyLoss
  LOSS_CONFIG: null
  METRICS: null
  N_EPOCHS: 30
  OPTIMIZER: $torch.optim.AdamW
  OPTIMIZER_CONFIG:
    lr: [5.e-4,1.e-3]
    weight_decay: 1.e-2
  SCHEDULER: $torch.optim.lr_scheduler.StepLR
  SCHEDULER_CONFIG:
    gamma: 1.
    step_size: 1
  TORCH_DEVICE: cuda:0
  TRACK_NORMS: True
  USE_TQDM: False
  USE_WANDB: True