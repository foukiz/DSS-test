PROJECT: "copytask_DSS_test"
DATASET:
  NAME: CopyMemory
  SENT_LENGTH: 10
  SEQ_LENGTH: 100
  TEST_SIZE: 20
  TRAIN_SIZE: 40
  VAL_SIZE: 20
  VOCABULARY: 10
MODEL:
  ACTIVATION: $torch.nn.GELU
  BIAS: True
  BIDIRECTIONAL: False
  DROPOUT: 0.
  ENCODING: embedding
  INPUT_SIZE: 8
  KERNEL_VERSION: gamma
  N_LAYERS: 6
  NAME: DSS
  NORMALIZATION: batch_norm
  POOLING: manytomany
  PRENORM: True
  SEED: [712] #[712,8,93,74,812]
  STATE_SIZE: 64
  USE_LENGTHS: False
TRAIN:
  BATCH_SIZE: 20
  DISPLAY_EPOCH: True
  DISPLAY_EVERY: null
  LOSS_FN: $torch.nn.CrossEntropyLoss
  LOSS_CONFIG: null
  METRICS: null
  N_EPOCHS: 10
  OPTIMIZER: $torch.optim.AdamW
  OPTIMIZER_CONFIG:
    lr: 0.001
    weight_decay: 0.01
  SCHEDULER: $torch.optim.lr_scheduler.SequentialLR
  SCHEDULER_CONFIG:
    scheduler1: $torch.optim.lr_scheduler.LinearLR
    scheduler1_config:
      start_factor: 0.2
      total_iters: 4
    scheduler2: $torch.optim.lr_scheduler.ReduceLROnPlateau
    scheduler2_config:
      patience: 10
      factor: 0.5
    milestones: 4
  TORCH_DEVICE: cpu
  TRACK_NORMS: True
  USE_TQDM: False
  USE_WANDB: False