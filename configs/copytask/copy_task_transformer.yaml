PROJECT: "copytask_Transformer"
DATASET:
  NAME: CopyMemory
  SENT_LENGTH: 10
  SEQ_LENGTH: 1000
  TEST_SIZE: 2000
  TRAIN_SIZE: 512000
  VAL_SIZE: 2000
  VOCABULARY: 10
MODEL:
  #ACTIVATION: $torch.nn.GELU
  BIAS: True
  ENCODING: embedding
  INPUT_SIZE: 512
  NAME: Transformer
  POOLING: manytomany
  SEED: [712,8,93,74,812]
  SEQ_LENGTH: 1000
TRAIN:
  BATCH_SIZE: 50
  DISPLAY_EPOCH: True
  DISPLAY_EVERY: null
  LOSS_FN: $torch.nn.CrossEntropyLoss
  LOSS_CONFIG: null
  METRICS: null
  N_EPOCHS: 20
  OPTIMIZER: $torch.optim.AdamW
  OPTIMIZER_CONFIG:
    lr: [1.e-2,4.e-2]
    weight_decay: 1.
  SCHEDULER: $torch.optim.lr_scheduler.StepLR
  SCHEDULER_CONFIG:
    gamma: 1.
    step_size: 1
  TORCH_DEVICE: cpu
  USE_TQDM: False
  USE_WANDB: False