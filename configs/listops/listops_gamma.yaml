PROJECT: "listops_gamma_no_norm"
DATASET:
  NAME: ListOps
  MIN_LEN: 500
  MAX_LEN: 2000
  MAX_DEPTH: 10
  MAX_ARGS: 10
  TEST_SIZE: 2000
  TRAIN_SIZE: 96000
  VAL_SIZE: 2000
  GENERATE: False
  PREPROCESSED: True
MODEL:
  ALPHA_MEAN: [4.,6.,8.,10.]
  ALPHA_STD: [0.5]
  THETA_MEAN: [4.]
  THETA_STD: 0.5
  ACTIVATION: $torch.nn.GELU
  BIAS: True
  BIDIRECTIONAL: False
  ENCODING: embedding
  N_LAYERS: 6
  NAME: DSS
  NORMALIZATION: batch_norm
  DROPOUT: 0.
  INPUT_SIZE: 128
  KERNEL_VERSION: gamma
  POOLING: average
  PRENORM: False
  SEED: [712,8,93] #[712,8,93,74,812]
TRAIN:
  BATCH_SIZE: 50
  DISPLAY_EPOCH: True
  DISPLAY_EVERY: null
  LOSS_FN: $torch.nn.CrossEntropyLoss
  LOSS_CONFIG: null
  METRICS: {'accuracy': $torchmetrics.Accuracy}
  METRICS_CONFIG:
    task: multiclass
    num_classes: 10
  N_EPOCHS: 50
  OPTIMIZER: $torch.optim.AdamW
  OPTIMIZER_CONFIG:
    lr: [1.e-2]
    weight_decay: 1.e-2
  SCHEDULER: $torch.optim.lr_scheduler.StepLR
  SCHEDULER_CONFIG:
    gamma: 0.9
    step_size: 1
  TORCH_DEVICE: cpu
  USE_TQDM: False
  USE_WANDB: False