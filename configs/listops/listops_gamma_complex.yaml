PROJECT: "listops_gamma_complex"
DATASET:
  NAME: ListOps
  MIN_LEN: 500
  MAX_LEN: 2000
  MAX_DEPTH: 10
  MAX_ARGS: 10
  TEST_SIZE: 2000
  TRAIN_SIZE: 96000
  VAL_SIZE: 2000
  GENERATE: False
MODEL:
  ALPHA_MEAN: [0.,]
  ALPHA_STD: [0.1]
  BETA_MEAN: [0.01]
  BETA_STD: [1.]
  THETA_MIN: [0.]
  THETA_MAX: [6.28]
  ACTIVATION: $torch.nn.GELU
  BIAS: True
  BIDIRECTIONAL: False
  DROPOUT: 0.
  ENCODING: embedding
  INPUT_SIZE: 128
  KERNEL_VERSION: gamma_complex
  N_LAYERS: 6
  NAME: DSS
  NORMALIZATION: [batch_norm]
  POOLING: average
  PRENORM: False
  SEED: [1112,0,712] #[712,8,93,74,812]
  USE_LENGTHS: True
TRAIN:
  BATCH_SIZE: 50
  DISPLAY_EPOCH: True
  DISPLAY_EVERY: null
  LOSS_FN: $torch.nn.CrossEntropyLoss
  LOSS_CONFIG: null
  METRICS: {'accuracy': $torchmetrics.Accuracy}
  METRICS_CONFIG:
    task: multiclass
    num_classes: 10
  N_EPOCHS: 50
  OPTIMIZER: $torch.optim.AdamW
  OPTIMIZER_CONFIG:
    lr: [0.001]
    weight_decay: [0.01]
  SCHEDULER: $torch.optim.lr_scheduler.ReduceLROnPlateau
  SCHEDULER_CONFIG:
    patience: 5
  TORCH_DEVICE: cpu
  TRACK_NORMS: True
  USE_TQDM: False
  USE_WANDB: False