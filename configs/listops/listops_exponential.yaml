PROJECT: "listops_exponential"
DATASET:
  NAME: ListOps
  MIN_LEN: 500
  MAX_LEN: 2000
  MAX_DEPTH: 10
  MAX_ARGS: 10
  TEST_SIZE: 2000
  TRAIN_SIZE: 96000
  VAL_SIZE: 2000
  GENERATE: False
MODEL:
  ALPHA_MEAN: [0.01]
  ALPHA_STD: 0.1
  THETA_MEAN: 1.0
  THETA_STD: 0.5
  ACTIVATION: $torch.nn.GELU 
  BIAS: True
  INPUT_SIZE: 128
  N_LAYERS: 6
  KERNEL_VERSION: exponential
  BIDIRECTIONAL: False
  ENCODING: embedding
  POOLING: average
  NAME: DSS
  DROPOUT: 0.
  NORMALIZATION: batch_norm
  ORDER_2_APPROX: False
  PRENORM: False
  SEED: [712,8,93,74,812]
  USE_LENGTHS: True
TRAIN:
  BATCH_SIZE: 50
  DISPLAY_EPOCH: True
  DISPLAY_EVERY: null
  LOSS_FN: $torch.nn.CrossEntropyLoss
  LOSS_CONFIG: null
  METRICS: {'accuracy': $torchmetrics.Accuracy}
  METRICS_CONFIG:
    task: multiclass
    num_classes: 10
  N_EPOCHS: 50
  OPTIMIZER: $torch.optim.AdamW
  OPTIMIZER_CONFIG:
    lr: [1.e-3]
    weight_decay: 1.e-2
  SCHEDULER: $torch.optim.lr_scheduler.StepLR
  SCHEDULER_CONFIG:
    gamma: 0.9
    step_size: 1
  TORCH_DEVICE: cpu
  USE_TQDM: False
  USE_WANDB: False