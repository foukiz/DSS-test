PROJECT: "PTB_transformer"
DATASET:
  NAME: PTB
  SEQ_LENGTH: 150
  TEST_SIZE: 3761
  TRAIN_SIZE: 42068
  VAL_SIZE: 3370
  PADDING_IDX: 0
MODEL:
  #ACTIVATION: $torch.nn.GELU
  BIAS: True
  ENCODING: embedding
  INPUT_SIZE: 512
  NAME: Transformer
  POOLING: manytomany
  SEED: [712,8,93] #[712,8,93,74,812]
  SEQ_LENGTH: 150
TRAIN:
  BATCH_SIZE: 50
  DISPLAY_EPOCH: True
  DISPLAY_EVERY: null
  LOSS_FN: $torch.nn.CrossEntropyLoss
  LOSS_CONFIG: null
  METRICS:
    BPC: $metrics.BPC
  METRICS_CONFIG:
    padding_idx: 0
  N_EPOCHS: 50
  OPTIMIZER:  $torch.optim.AdamW
  OPTIMIZER_CONFIG:
    lr: [1.e-2,4.e-2]
    weight_decay: 1.e-2
  SCHEDULER: $torch.optim.lr_scheduler.StepLR
  SCHEDULER_CONFIG:
    gamma: 1.
    step_size: 1
  TORCH_DEVICE: cpu
  USE_TQDM: False
  USE_WANDB: False